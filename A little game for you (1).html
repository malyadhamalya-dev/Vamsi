<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little game for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<style>
:root{--bg1:#FFE9EE;--bg2:#FFC2D1;--ink:#6B1B3A;--rose:#F0486F;--lav:#8E7CC3;--cell:#FFF7F0;--cellwin:#FFD0DC;--paper:#FFF8F2;--paperink:#6B1B3A;--line:#F6D5DD;--bubble:#fff;--bubbleink:#6B1B3A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--pw:clamp(120px,30vw,170px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2B1020;--bg2:#4A1A33;--ink:#FFD9E4;--cell:#3E1A2E;--cellwin:#6A2646}}
:root[data-theme="dark"]{--bg1:#2B1020;--bg2:#4A1A33;--ink:#FFD9E4;--cell:#3E1A2E;--cellwin:#6A2646}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font-family:Fraunces,Georgia,serif}
button{font:inherit;cursor:pointer;border:0;background:var(--rose);color:#fff;padding:.7em 1.4em;border-radius:999px;font-weight:600;box-shadow:0 6px 0 #C22F55,0 12px 24px rgba(240,72,111,.35);transition:transform .15s,box-shadow .15s}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #C22F55}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(28px + env(safe-area-inset-top,0px)) 20px 20px;opacity:0;pointer-events:none;transition:opacity .7s;overflow-y:auto}
.scene.on{opacity:1;pointer-events:auto}
h1,h2{margin:0;text-align:center;font-weight:600;line-height:1.15}
h1{font-size:clamp(1.8rem,7vw,2.8rem)}
h2{font-size:clamp(1.6rem,6vw,2.5rem);font-style:italic;font-weight:500;max-width:15em}
/* puppy */
.pup{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:var(--pw);z-index:5;pointer-events:none;transition:left 2.4s ease-in-out}
.pimg svg{width:100%;display:block;overflow:visible;animation:breathe 2.4s ease-in-out infinite}
.walking .pimg svg{animation:waddle .5s ease-in-out infinite}
.tail{transform-box:fill-box;transform-origin:10% 80%;animation:wag .45s ease-in-out infinite alternate}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.legL,.legR{transform-box:fill-box;transform-origin:top}
.walking .legL{animation:step .5s ease-in-out infinite}
.walking .legR{animation:step .5s ease-in-out infinite reverse}
@keyframes breathe{50%{transform:translateY(-3px) scale(1.01)}}
@keyframes waddle{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-8px)}}
@keyframes step{50%{transform:rotate(18deg)}}
@keyframes wag{to{transform:rotate(28deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bubble{position:absolute;bottom:calc(100% + 6px);left:50%;width:min(280px,80vw);transform:translateX(-50%) scale(.6);transform-origin:50% 100%;opacity:0;background:var(--bubble);color:var(--bubbleink);padding:16px 18px;border-radius:22px;text-align:center;font-size:1.1rem;line-height:1.4;box-shadow:0 10px 30px rgba(107,27,58,.2);pointer-events:auto;transition:.4s cubic-bezier(.3,1.6,.5,1)}
.bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:var(--bubble)}
.bubble button{display:block;margin:12px auto 4px;font-size:1rem}
/* game */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(78vw,330px);margin:26px 0 18px}
.cell{aspect-ratio:1;background:var(--cell);border-radius:22px;display:grid;place-items:center;box-shadow:0 6px 16px rgba(107,27,58,.14);transition:background .4s}
.cell{cursor:pointer}
.cell.win{background:var(--cellwin)}
.cell.hint{animation:hint 1s ease-in-out infinite}
@keyframes hint{50%{transform:scale(1.07);background:var(--cellwin)}}
.cell svg{width:58%;fill:var(--rose);animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
.cell.win svg{animation:pop .45s cubic-bezier(.3,1.7,.5,1),beat .7s .5s infinite}
.o{width:52%;aspect-ratio:1;border:9px solid var(--lav);border-radius:50%;animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}}
@keyframes beat{50%{transform:scale(1.18)}}
#st{font-size:1.3rem;min-height:1.6em;font-style:italic}
/* gift */
#gift{margin-top:5vh;display:flex;flex-direction:column;align-items:center;gap:30px;opacity:0;transform:scale(.3);transition:.7s cubic-bezier(.3,1.6,.5,1)}
#gift.show{opacity:1;transform:none}
.gb{position:relative;width:150px;height:150px;animation:float 2s ease-in-out infinite}
.gb .body,.gb .lid{position:absolute;left:50%;transform:translateX(-50%);background:var(--rose);border-radius:10px}
.gb .body{bottom:0;width:124px;height:92px}
.gb .lid{bottom:84px;width:146px;height:36px;background:#FF6B8B;transition:transform .8s cubic-bezier(.3,1.4,.5,1),opacity .8s}
.gb .body::before,.gb .lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:20px;margin-left:-10px;background:#FFF1B8}
.gb .lid::after{content:"";position:absolute;left:50%;bottom:100%;width:44px;height:30px;margin-left:-22px;border:8px solid #FFF1B8;border-radius:50% 50% 8px 8px}
.gb.open{animation:none}
.gb.open .lid{transform:translate(-50%,-90px) rotate(-22deg);opacity:0}
@keyframes float{50%{transform:translateY(-10px) rotate(2deg)}}
/* letter */
.hl{margin-top:2vh}
.paper{margin:24px 0 90px;width:min(560px,100%);background:var(--paper);color:var(--paperink);padding:26px 24px;border-radius:6px;box-shadow:0 18px 40px rgba(107,27,58,.25);transform:rotate(-.7deg);font-family:Caveat,"Segoe Script",cursive;font-size:clamp(1.35rem,5vw,1.7rem);line-height:36px;background-image:repeating-linear-gradient(transparent 0 35px,var(--line) 35px 36px);background-position:0 26px;opacity:0;transition:opacity 1s}
.paper.show{opacity:1}
.paper p{margin:0 0 36px;min-height:36px}
.paper p.q{color:#D42A55;font-weight:700;padding-left:1.4em;position:relative}
.paper p.q::before{content:"♥";position:absolute;left:0}
.typing::after{content:"|";margin-left:2px;animation:caret .7s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
#yes{display:none;margin:0 auto 16px;font-family:Fraunces,serif}
.fly{position:fixed;bottom:-50px;z-index:20;pointer-events:none;animation:rise var(--d) ease-out forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
#movie{position:fixed;inset:0;z-index:40;background:#1d0b17;display:none;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity 1.2s}#movie.on{display:flex}#movie.vis{opacity:1}#mv{width:min(100vw,calc(74vh*.667));height:auto;transition:opacity .8s}.sc{animation:fin 1.2s both}@keyframes fin{from{opacity:0}}#cap{font-family:Caveat,cursive;color:#FFD9E4;font-size:clamp(1.5rem,6vw,2.2rem);line-height:1.2;text-align:center;padding:12px 24px;min-height:3.6em;max-width:560px;transition:opacity .8s}#cap.big{font-size:clamp(2.2rem,10vw,3.4rem);color:#FF8FA8}#mute,#again{box-shadow:none;background:#ffffff26}#mute{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px}.slide{animation:slide 14s linear infinite}@keyframes slide{to{transform:translateX(-400px)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.arrive{animation:arrive 4s ease-out both}@keyframes arrive{from{transform:translateX(-340px)}}.kiss{transform-box:fill-box;transform-origin:50% 100%;animation:kiss 2.5s 2s ease-in-out infinite alternate}@keyframes kiss{to{transform:translate(12px,4px) rotate(9deg)}}.hrt{font-size:22px;fill:#F0486F;opacity:0;animation:hr 3s ease-out infinite}@keyframes hr{20%{opacity:1}to{transform:translateY(-90px);opacity:0}}.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}@keyframes sway{to{transform:rotate(3deg)}}.rumble{animation:rumble .25s linear infinite alternate}@keyframes rumble{to{transform:translateY(2px)}}.puff{opacity:0;animation:puff 3s ease-out infinite}@keyframes puff{20%{opacity:.8}to{transform:translate(24px,-60px) scale(2);opacity:0}}.talk{opacity:0;animation:talk 5s infinite}@keyframes talk{10%,40%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<section class="scene on" id="intro"><h1>A little game, just for you</h1></section>

<section class="scene" id="game">
  <h1>Hearts vs. circles</h1>
  <div class="board" id="board" aria-label="Tic-tac-toe board"></div>
  <div id="st">Get ready…</div>
</section>

<section class="scene" id="gift-s">
  <div id="gift">
    <div class="gb" id="gb"><div class="lid"></div><div class="body"></div></div>
    <button id="openBtn">Open your gift</button>
  </div>
</section>

<section class="scene" id="letter">
  <h2 class="hl">You won me by winning the game, heyyyy 💗</h2>
  <div class="paper" id="paper"></div>
  <button id="yes">Yes, always 💗</button>
</section>

<div class="pup" id="pup" style="left:calc(-1 * var(--pw) - 40px)">
  <div class="bubble" id="bub" role="status"></div>
  <div class="pimg">
  <svg viewBox="0 0 160 150" role="img" aria-label="A cute white puppy">
    <g class="tail"><ellipse cx="132" cy="92" rx="9" ry="20" transform="rotate(35 132 92)" fill="#fff" stroke="#EBCFD6" stroke-width="3"/></g>
    <g class="legL"><rect x="50" y="116" width="20" height="28" rx="10" fill="#fff" stroke="#EBCFD6" stroke-width="3"/></g>
    <g class="legR"><rect x="90" y="116" width="20" height="28" rx="10" fill="#fff" stroke="#EBCFD6" stroke-width="3"/></g>
    <ellipse cx="80" cy="104" rx="44" ry="32" fill="#fff" stroke="#EBCFD6" stroke-width="3"/>
    <path d="M80 126c-14-10-9-18 0-13 9-5 14 3 0 13z" fill="#F0486F"/>
    <ellipse cx="44" cy="66" rx="14" ry="26" transform="rotate(14 44 66)" fill="#F4E6E0" stroke="#EBCFD6" stroke-width="3"/>
    <ellipse cx="116" cy="66" rx="14" ry="26" transform="rotate(-14 116 66)" fill="#F4E6E0" stroke="#EBCFD6" stroke-width="3"/>
    <circle cx="80" cy="62" r="38" fill="#fff" stroke="#EBCFD6" stroke-width="3"/>
    <ellipse cx="58" cy="76" rx="8" ry="5" fill="#FFB1C3" opacity=".65"/>
    <ellipse cx="102" cy="76" rx="8" ry="5" fill="#FFB1C3" opacity=".65"/>
    <g class="eyes"><circle cx="66" cy="60" r="5.5" fill="#3B1E2B"/><circle cx="94" cy="60" r="5.5" fill="#3B1E2B"/><circle cx="64.5" cy="58" r="1.8" fill="#fff"/><circle cx="92.5" cy="58" r="1.8" fill="#fff"/></g>
    <path d="M80 77c-1 7-9 10-14 4M80 77c1 7 9 10 14 4" fill="none" stroke="#3B1E2B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M74 83c0 9 12 9 12 0z" fill="#FF8FA8"/>
    <ellipse cx="80" cy="71" rx="7" ry="5" fill="#3B1E2B"/>
  </svg></div>
</div>

<script>
const NAME = "my love"; // change this to his name
const LEFT = "calc(-1 * var(--pw) - 40px)", CENTER = "calc(50% - var(--pw) / 2)", RIGHT = "100%";
const $ = s => document.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const pup = $("#pup"), bub = $("#bub");
const scene = id => document.querySelectorAll(".scene").forEach(s => s.classList.toggle("on", s.id === id));
const say = h => { bub.innerHTML = h; bub.classList.add("show"); };
const hush = () => bub.classList.remove("show");
function goTo(pos, ms) {
  pup.style.transitionDuration = ms + "ms"; pup.classList.add("walking"); pup.style.left = pos;
  return wait(ms).then(() => pup.classList.remove("walking"));
}
function jump(pos) { pup.style.transitionDuration = "0ms"; pup.style.left = pos; pup.offsetWidth; }
function hearts(n = 26) {
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span"); s.className = "fly";
    s.textContent = ["💗", "💖", "🤍", "💕"][i % 4];
    s.style.cssText = `left:${Math.random() * 96}vw;--d:${2.6 + Math.random() * 2.4}s;font-size:${18 + Math.random() * 22}px;animation-delay:${Math.random() * .8}s`;
    document.body.append(s); setTimeout(() => s.remove(), 6500);
  }
}
const HEART = '<svg viewBox="0 0 32 29" aria-label="heart"><path d="M16 28C-6 13 5 -3 16 6c11-9 22 7 0 22z"/></svg>';
const board = $("#board");
for (let i = 0; i < 9; i++) board.insertAdjacentHTML("beforeend", '<div class="cell"></div>');
const cells = [...board.children];

async function intro() {
  await wait(700);
  await goTo(CENTER, 2800);
  say('Heyy! 🐾<br>Let’s play a game.<br>You’re the heart 💗, I’m the circle.<br>The winner gets the <b>best gift</b>.<button id="go">Let’s play</button>');
  $("#go").onclick = game;
}
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let st = Array(9).fill(null), busy = true, hintT;
const free = () => st.map((v, i) => v ? null : i).filter(i => i !== null);
const lineOf = m => LINES.find(l => l.every(i => st[i] === m));
const put = (i, m) => { st[i] = m; cells[i].innerHTML = m === "x" ? HEART : '<div class="o"></div>'; };
cells.forEach((c, i) => { c.tabIndex = 0; c.onclick = () => play(i); c.onkeydown = e => e.key === "Enter" && play(i); });
function hint() {
  clearTimeout(hintT);
  hintT = setTimeout(() => {
    if (busy) return;
    let best = null, top = -1;
    for (const i of free()) {
      let s = 0;
      for (const l of LINES) if (l.includes(i) && !l.some(j => st[j] === "o")) s += 1 + l.filter(j => st[j] === "x").length * 3;
      if (s > top) { top = s; best = i; }
    }
    if (best !== null) cells[best].classList.add("hint");
  }, 5000);
}
async function game() {
  hush(); await wait(400); scene("game"); goTo(RIGHT, 2400);
  await wait(1500);
  $("#st").textContent = "You’re the heart 💗 Tap a square.";
  busy = false; hint();
}
async function play(i) {
  if (busy || st[i]) return;
  busy = true; clearTimeout(hintT);
  cells.forEach(c => c.classList.remove("hint"));
  put(i, "x");
  const w = lineOf("x");
  if (w) return finish(w);
  $("#st").textContent = "Circle is thinking…";
  await wait(900);
  const f = free();
  if (!f.length) return reset();
  // the circle plays softly: never wins, never blocks the heart
  const threats = LINES.filter(l => l.filter(j => st[j] === "x").length === 2 && l.some(j => !st[j])).map(l => l.find(j => !st[j]));
  const wins = k => LINES.some(l => l.includes(k) && l.every(j => j === k || st[j] === "o"));
  const score = k => LINES.reduce((s, l) => s + (l.includes(k) && !l.some(j => st[j] === "o") ? l.filter(j => st[j] === "x").length + 1 : 0), 0);
  let pool = f.filter(k => !threats.includes(k) && !wins(k));
  if (!pool.length) pool = f.filter(k => !wins(k));
  if (!pool.length) pool = f;
  const low = Math.min(...pool.map(score));
  const picks = pool.filter(k => score(k) === low);
  put(picks[Math.floor(Math.random() * picks.length)], "o");
  const canWin = LINES.some(l => !l.some(j => st[j] === "o"));
  if (!free().length || !canWin) return reset();
  busy = false; $("#st").textContent = "Your turn 💗"; hint();
}
async function reset() {
  $("#st").textContent = "So close! Let’s try again 💗";
  await wait(1800);
  st = Array(9).fill(null); cells.forEach(c => { c.innerHTML = ""; c.classList.remove("hint", "win"); });
  $("#st").textContent = "Your turn 💗"; busy = false; hint();
}
async function finish(w) {
  w.forEach(i => cells[i].classList.add("win"));
  $("#st").textContent = "You won! 💗"; hearts();
  await wait(2200);
  win();
}
async function win() {
  scene("gift-s"); jump(LEFT);
  await wait(700);
  await goTo(CENTER, 2800);
  say("You won! 🎉<br>Here’s your gift.");
  await wait(1400);
  $("#gift").classList.add("show");
  $("#openBtn").onclick = openGift;
}
async function openGift() {
  $("#openBtn").style.visibility = "hidden";
  $("#gb").classList.add("open"); hush(); hearts(30);
  await wait(1900);
  letter();
}
const lines = [
  ["", `Dear ${NAME},`],
  ["", "Okay… I may have rigged that game a tiny bit. 🙈 But winning me? That part was real."],
  ["", "So here are a few questions, and I want honest answers:"],
  ["q", "Will you keep being my favorite person, even on my worst days?"],
  ["q", "Will you hold my hand when things get messy?"],
  ["q", "Will you marry me when we get settled?"],
  ["q", "Will you let me steal your hoodie forever?"],
  ["q", "Will you plan the next adventure with me?"],
  ["", "Tell me your answers in person. I’ll be the one smiling like crazy. 💗"]
];
async function letter() {
  scene("letter"); goTo(RIGHT, 2000);
  await wait(2200);
  const paper = $("#paper"); paper.classList.add("show");
  await wait(900);
  for (const [cls, text] of lines) {
    const p = document.createElement("p"); p.className = cls + " typing"; paper.append(p);
    p.scrollIntoView({ behavior: "smooth", block: "center" });
    for (const ch of text) { p.textContent += ch; await wait(/[,.?]/.test(ch) ? 170 : 45); }
    p.classList.remove("typing");
    await wait(550);
  }
  const y = $("#yes"); y.style.display = "block"; y.scrollIntoView({ behavior: "smooth", block: "center" });
  y.onclick = () => { hearts(50); y.textContent = "I knew it. 🐶💗"; music(); setTimeout(movie, 2200); };
}
document.body.insertAdjacentHTML('beforeend',`<div id='movie'><button id='mute' aria-label='Mute music'>♪</button><svg id='mv' viewBox='0 0 400 600'></svg><div id='cap'></div></div>`);
const P=(x,y,b,s=1)=>`<g transform='translate(${x} ${y}) scale(${s})'><rect x='-14' y='22' width='28' height='44' rx='12' fill='${b?'#4A6FA5':'#F0486F'}'/>${b?'':`<path d='M-14 60l-9 24h46l-9-24z' fill='#F0486F'/>`}<circle cy='6' r='16' fill='#F3C9A8'/><path d='${b?'M-17 5a17 15 0 0 1 34 0z':'M-18 8a18 20 0 0 1 36 0v24h-7v-20h-22v20h-7z'}' fill='#2B1A22'/><circle cx='-5' cy='9' r='1.7' fill='#2B1A22'/><circle cx='5' cy='9' r='1.7' fill='#2B1A22'/><path d='M-3 15q3 3 6 0' stroke='#B5524F' fill='none' stroke-width='1.4'/></g>`;
const H=(x,y,d)=>`<text class='hrt' x='${x}' y='${y}' style='animation-delay:${d}s'>♥</text>`;
const G=(id,a,b)=>`<defs><linearGradient id='${id}' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${a}'/><stop offset='1' stop-color='${b}'/></linearGradient></defs><rect width='400' height='600' fill='url(#${id})'/>`;
const bench=(x,w)=>`<rect x='${x}' y='414' width='${w}' height='14' rx='4' fill='#7A4B32'/><rect x='${x+12}' y='426' width='8' height='32' fill='#5A3623'/><rect x='${x+w-20}' y='426' width='8' height='32' fill='#5A3623'/>`;
const SC=[
`${G('g1','#FFB48A','#FFE6CC')}<circle cx='300' cy='120' r='40' fill='#FFF3C4'/><g class='arrive'><rect x='-30' y='190' width='460' height='180' rx='14' fill='#35507F'/><rect x='-30' y='312' width='460' height='12' fill='#FFC95C'/>${[0,1,2,3,4,5].map(i=>`<rect x='${i*80-10}' y='215' width='56' height='64' rx='8' fill='#FFF1B8'/>`).join('')}</g><circle class='puff' cx='70' cy='185' r='12' fill='#fff'/><circle class='puff' cx='70' cy='185' r='12' fill='#fff' style='animation-delay:1.5s'/><rect y='370' width='400' height='230' fill='#B8A798'/><rect y='430' width='400' height='6' fill='#FFD34D'/><rect x='150' width='3' height='110' fill='#1E3A5F'/><rect x='248' width='3' height='110' fill='#1E3A5F'/><rect x='125' y='100' width='150' height='46' rx='8' fill='#1E3A5F'/><text x='200' y='132' text-anchor='middle' fill='#fff' font-size='24' font-family='Fraunces,serif'>Platform 3</text>${P(168,352,1)}${P(226,352,0)}${bench(110,180)}<g class='talk'><ellipse cx='168' cy='318' rx='24' ry='14' fill='#fff'/><text x='168' y='324' text-anchor='middle' font-size='16'>…</text></g><g class='talk' style='animation-delay:2.5s'><ellipse cx='226' cy='318' rx='24' ry='14' fill='#fff'/><text x='226' y='324' text-anchor='middle' font-size='16'>♥</text></g>`,

function tone(f,t,d,v,ty){const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.1)}
function music(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume();mg=ac.createGain();mg.gain.value=.5;mg.connect(ac.destination);setInterval(()=>{const t=ac.currentTime+.05,c=CH[Math.floor(step/8)%4],n=step%8;if(!n)c.forEach(f=>tone(f/2,t,3.8,.1,'triangle'));tone(c[[0,1,2,1,2,1,2,1][n]]*2,t,1.3,.09);step++},480)}catch(e){}}
